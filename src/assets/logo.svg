  <circle cx="37" cy="18" r="5" fill="white" />

  <!-- Fork -->
  <rect x="45" y="20" width="3" height="30" fill="white" />
  <rect x="45" y="20" width="8" height="3" fill="white" />

  <!-- Text -->
  <text x="85" y="50" font-family="Poppins, sans-serif" font-size="28" fill="#333" font-weight="bold">
    Bitezy
