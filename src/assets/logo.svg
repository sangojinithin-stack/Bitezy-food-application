    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6a00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee0979;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Circle Background -->
  <circle cx="40" cy="40" r="30" fill="url(#grad1)" />

  <!-- Bite Mark -->
